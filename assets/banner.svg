<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Control por gestos: OutRun y Star Force en el navegador">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07070d"/>
      <stop offset="0.55" stop-color="#1a0f2e"/>
      <stop offset="1" stop-color="#ff0055"/>
    </linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb300"/>
      <stop offset="1" stop-color="#ff0055"/>
    </linearGradient>
    <linearGradient id="titulo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff0055"/>
    </linearGradient>
    <clipPath id="mitad"><rect x="0" y="0" width="1200" height="300"/></clipPath>
  </defs>
  <rect width="1200" height="420" fill="url(#cielo)"/>
  <!-- estrellas -->
  <g fill="#fff" opacity="0.8">
    <circle cx="90" cy="40" r="1.6"/><circle cx="220" cy="90" r="1.2"/><circle cx="340" cy="30" r="1.8"/>
    <circle cx="470" cy="70" r="1.2"/><circle cx="760" cy="36" r="1.6"/><circle cx="880" cy="84" r="1.2"/>
    <circle cx="1010" cy="28" r="1.8"/><circle cx="1130" cy="76" r="1.4"/><circle cx="640" cy="22" r="1.2"/>
  </g>
  <!-- sol -->
  <g clip-path="url(#mitad)">
    <circle cx="600" cy="300" r="150" fill="url(#sol)"/>
    <g fill="#1a0f2e">
      <rect x="440" y="226" width="320" height="5"/><rect x="440" y="248" width="320" height="8"/>
      <rect x="440" y="272" width="320" height="11"/>
    </g>
  </g>
  <!-- suelo -->
  <rect y="300" width="1200" height="120" fill="#07070d"/>
  <g stroke="#7c4dff" stroke-width="1.5" opacity="0.9">
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#00e5ff" stroke-width="2"/>
    <line x1="600" y1="300" x2="-200" y2="420"/><line x1="600" y1="300" x2="100" y2="420"/>
    <line x1="600" y1="300" x2="350" y2="420"/><line x1="600" y1="300" x2="600" y2="420"/>
    <line x1="600" y1="300" x2="850" y2="420"/><line x1="600" y1="300" x2="1100" y2="420"/>
    <line x1="600" y1="300" x2="1400" y2="420"/>
    <line x1="0" y1="318" x2="1200" y2="318"/><line x1="0" y1="344" x2="1200" y2="344"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
  </g>
  <!-- título -->
  <text x="600" y="150" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="2" fill="url(#titulo)">CONTROL POR GESTOS</text>
  <text x="600" y="198" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="600" letter-spacing="6" fill="#00e5ff">OUTRUN  ·  STAR FORCE</text>
  <text x="600" y="240" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#ffb300">Jugá clásicos retro con la mano frente a la cámara</text>
</svg>
